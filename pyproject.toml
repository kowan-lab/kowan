[project]
name = "kowan"
dynamic = ["version"]
description = "Kowan — Docker management platform: REST control-plane + agent + CLI over an in-house stream multiplexer"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
# The core (mux, tunnel, store, auth) is pure stdlib; these power the
# server/agent/CLI. Floors are the oldest releases without known advisories;
# requirements.txt pins the exact versions the images ship.
dependencies = [
    "aiohttp>=3.14.4",
    "pydantic>=2.4",
    "cryptography>=49",
    "httpx>=0.27",
    "typer>=0.27",
    "pyyaml>=6",
    "tzdata>=2024.1",
    # Optional speedups with stdlib fallbacks (kowan/jsonx.py, kowan/eventloop.py).
    "orjson>=3.11.6",
    "uvloop>=0.19; sys_platform != 'win32' and platform_python_implementation == 'CPython'",
]

[project.scripts]
kowan-server = "kowan.server:main"
kowan-agent = "kowan.agent:main"
kowanctl = "kowan.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["kowan*"]

[tool.setuptools.dynamic]
version = {attr = "kowan.__version__"}
