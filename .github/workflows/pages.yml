name: Website

# Builds the website (site/ plus the docs in site/_docs, scripts/build_site.py)
# and publishes it to GitHub Pages: https://kowan.io
on:
  push:
    branches: [main]
    paths: ["site/**", "docs/CHANGELOG.md", "scripts/build_site.py", "requirements-site.txt", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -r requirements-site.txt
      - run: python scripts/build_site.py
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: build/site
          include-hidden-files: true  # site/.nojekyll
      - id: deployment
        uses: actions/deploy-pages@v5
